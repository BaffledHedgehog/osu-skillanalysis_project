worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=pulse:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=pulse_conn:1m;
    server {
        listen 8088;
        location /api/local/ { return 403; }
        location /api/session/ { return 403; }
        location / {
            limit_req zone=pulse burst=12 nodelay;
            limit_req_status 429;
            limit_conn pulse_conn 8;
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
